name: Lydian
description: Lydian (Lydian Labs) develops modular, turnkey plants that produce sustainable aviation
  fuel (SAF) from captured CO2 and hydrogen. Its technology converts carbon dioxide and electrolytic
  hydrogen into jet fuel via a syngas production process compatible with existing aircraft, targeting
  deployment in under two years and capital costs roughly 50% lower than conventional SAF plants. The
  company markets to airlines, fuel buyers, and facility operators. Based in Charlestown, Massachusetts,
  Lydian is backed by Union Square Ventures. This is a hardware/industrial company with no public API,
  SDK, or developer portal surface at the time of enrichment.
